<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Readings Admin - OLMQ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .admin-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .admin-content {
            padding: 30px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        
        .status-card h3 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .controls-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }
        
        .controls-section h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .log-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
        }
        
        .log-container {
            background: #333;
            color: #00ff00;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            height: 300px;
            overflow-y: auto;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: #28a745;
        }
        
        .notification.error {
            background: #dc3545;
        }
        
        .notification.info {
            background: #17a2b8;
        }
        
        @media (max-width: 768px) {
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-book-open"></i> Daily Readings Admin Panel</h1>
            <p>Our Lady Mother and Queen Catholic Church, Badore</p>
        </div>
        
        <div class="admin-content">
            <!-- Status Overview -->
            <div class="status-grid">
                <div class="status-card">
                    <h3><i class="fas fa-calendar-day"></i> Last Update</h3>
                    <div class="status-value" id="last-update">Loading...</div>
                </div>
                
                <div class="status-card">
                    <h3><i class="fas fa-clock"></i> Next Update</h3>
                    <div class="status-value" id="next-update">Loading...</div>
                </div>
                
                <div class="status-card">
                    <h3><i class="fas fa-church"></i> Liturgical Season</h3>
                    <div class="status-value" id="liturgical-season">Loading...</div>
                </div>
                
                <div class="status-card">
                    <h3><i class="fas fa-palette"></i> Liturgical Color</h3>
                    <div class="status-value" id="liturgical-color">Loading...</div>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="controls-section">
                <h3><i class="fas fa-cogs"></i> System Controls</h3>
                <div class="button-group">
                    <button class="btn btn-primary" id="refresh-readings">
                        <i class="fas fa-sync-alt"></i> Refresh Readings
                    </button>
                    
                    <button class="btn btn-success" id="test-api">
                        <i class="fas fa-plug"></i> Test API Connection
                    </button>
                    
                    <button class="btn btn-warning" id="clear-cache">
                        <i class="fas fa-trash"></i> Clear Cache
                    </button>
                    
                    <button class="btn btn-danger" id="reset-system">
                        <i class="fas fa-redo"></i> Reset System
                    </button>
                </div>
            </div>
            
            <!-- Activity Log -->
            <div class="log-section">
                <h3><i class="fas fa-list"></i> Activity Log</h3>
                <div class="log-container" id="activity-log">
                    <div>System initialized...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/readings-config.js"></script>
    <script src="assets/js/daily-readings.js"></script>
    <script>
        class ReadingsAdmin {
            constructor() {
                this.log = [];
                this.init();
            }
            
            init() {
                this.updateStatus();
                this.bindEvents();
                this.startStatusUpdates();
                this.addLog('Admin panel initialized');
            }
            
            updateStatus() {
                if (window.dailyReadingsManager) {
                    const status = window.dailyReadingsManager.getStatus();
                    
                    document.getElementById('last-update').textContent = 
                        status.lastUpdate || 'Never';
                    
                    document.getElementById('next-update').textContent = 
                        status.nextUpdate ? status.nextUpdate.toLocaleString() : 'Unknown';
                    
                    document.getElementById('liturgical-season').textContent = 
                        status.liturgicalSeason || 'Unknown';
                    
                    document.getElementById('liturgical-color').textContent = 
                        status.liturgicalColor || 'Unknown';
                } else {
                    this.addLog('Readings manager not available', 'error');
                }
            }
            
            bindEvents() {
                document.getElementById('refresh-readings').addEventListener('click', () => {
                    this.refreshReadings();
                });
                
                document.getElementById('test-api').addEventListener('click', () => {
                    this.testAPI();
                });
                
                document.getElementById('clear-cache').addEventListener('click', () => {
                    this.clearCache();
                });
                
                document.getElementById('reset-system').addEventListener('click', () => {
                    this.resetSystem();
                });
            }
            
            async refreshReadings() {
                const btn = document.getElementById('refresh-readings');
                const originalText = btn.innerHTML;
                
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Refreshing...';
                btn.disabled = true;
                
                try {
                    if (window.dailyReadingsManager) {
                        await window.dailyReadingsManager.forceUpdate();
                        this.addLog('Readings refreshed successfully', 'success');
                        this.showNotification('Readings updated successfully!', 'success');
                    } else {
                        throw new Error('Readings manager not available');
                    }
                } catch (error) {
                    this.addLog(`Failed to refresh readings: ${error.message}`, 'error');
                    this.showNotification('Failed to refresh readings', 'error');
                }
                
                btn.innerHTML = originalText;
                btn.disabled = false;
                this.updateStatus();
            }
            
            async testAPI() {
                const btn = document.getElementById('test-api');
                const originalText = btn.innerHTML;
                
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Testing...';
                btn.disabled = true;
                
                try {
                    // Test API connection
                    const response = await fetch('https://api.usccb.org/bible/readings/' + new Date().toISOString().split('T')[0]);
                    
                    if (response.ok) {
                        this.addLog('API connection successful', 'success');
                        this.showNotification('API connection is working!', 'success');
                    } else {
                        throw new Error(`API returned status: ${response.status}`);
                    }
                } catch (error) {
                    this.addLog(`API test failed: ${error.message}`, 'error');
                    this.showNotification('API connection failed', 'error');
                }
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
            
            clearCache() {
                try {
                    localStorage.removeItem('cachedReadings');
                    localStorage.removeItem('lastReadingsUpdate');
                    this.addLog('Cache cleared successfully', 'success');
                    this.showNotification('Cache cleared!', 'success');
                    this.updateStatus();
                } catch (error) {
                    this.addLog(`Failed to clear cache: ${error.message}`, 'error');
                    this.showNotification('Failed to clear cache', 'error');
                }
            }
            
            resetSystem() {
                if (confirm('Are you sure you want to reset the entire readings system? This will clear all cache and restart the system.')) {
                    try {
                        this.clearCache();
                        
                        if (window.dailyReadingsManager) {
                            // Reinitialize the system
                            window.dailyReadingsManager = new window.DailyReadingsManager();
                        }
                        
                        this.addLog('System reset successfully', 'success');
                        this.showNotification('System reset complete!', 'success');
                        this.updateStatus();
                    } catch (error) {
                        this.addLog(`Failed to reset system: ${error.message}`, 'error');
                        this.showNotification('Failed to reset system', 'error');
                    }
                }
            }
            
            addLog(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                
                this.log.push({ timestamp, message, type });
                
                const logContainer = document.getElementById('activity-log');
                const logDiv = document.createElement('div');
                logDiv.textContent = logEntry;
                
                if (type === 'error') {
                    logDiv.style.color = '#ff6b6b';
                } else if (type === 'success') {
                    logDiv.style.color = '#51cf66';
                } else if (type === 'warning') {
                    logDiv.style.color = '#ffd43b';
                }
                
                logContainer.appendChild(logDiv);
                logContainer.scrollTop = logContainer.scrollHeight;
                
                // Keep only last 100 log entries
                if (logContainer.children.length > 100) {
                    logContainer.removeChild(logContainer.firstChild);
                }
            }
            
            showNotification(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                
                document.body.appendChild(notification);
                
                setTimeout(() => notification.classList.add('show'), 100);
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => document.body.removeChild(notification), 300);
                }, 3000);
            }
            
            startStatusUpdates() {
                setInterval(() => {
                    this.updateStatus();
                }, 30000); // Update every 30 seconds
            }
        }
        
        // Initialize admin panel when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.readingsAdmin = new ReadingsAdmin();
        });
    </script>
</body>
</html>
